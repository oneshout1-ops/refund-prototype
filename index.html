<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}#nowCheck{display:none !important}
</style></head><body>
<title>통합 환급 프로토타입 (포트폴리오용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 왼쪽 폰 프레임(서비스 화면, 라이트 고정) + 오른쪽 검토 패널(시나리오·화면 목록·이 화면의 규칙). 좁은 화면에서는 위아래로 쌓임 */
:root {
  /* 검토 패널 (테마 따라감) */
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #17202e;
  --muted: #5b6676;
  --line: #dbe1e8;
  --accent: #2b63e8;
  --accent-soft: #e6eeff;
  --warn: #9a5a06;
  --warn-soft: #fdf1df;
  --ok: #157a4a;
  /* 서비스 화면 (실제 앱처럼 라이트 고정) */
  --a-bg: #ffffff;
  --a-ink: #191f28;
  --a-sub: #6b7684;
  --a-faint: #8b95a1;
  --a-line: #e5e8eb;
  --a-gray: #f2f4f6;
  --a-blue: #3182f6;
  --a-blue-soft: #e8f3ff;
  --a-red: #e5484d;
  --a-dim: #d1d6db;
  --font: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #171f29; --ink: #e6ebf1; --muted: #9ba7b5; --line: #2a3542;
    --accent: #7aa2ff; --accent-soft: #1b2944; --warn: #f2b45a; --warn-soft: #2f2412; --ok: #5fd39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #171f29; --ink: #e6ebf1; --muted: #9ba7b5; --line: #2a3542;
  --accent: #7aa2ff; --accent-soft: #1b2944; --warn: #f2b45a; --warn-soft: #2f2412; --ok: #5fd39a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); margin: 0; padding-inline: 16px; padding-block: 24px 40px; }
button { font-family: inherit; }
.wrap { max-width: 1120px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 900px) { .wrap { grid-template-columns: 409px minmax(0, 1fr); align-items: start; } .phone-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.top { max-width: 1120px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.top h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
.top p { margin: 0; color: var(--muted); font-size: 13.5px; }

/* 폰 프레임 */
.sheetwrap { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; z-index: 5; }
.sheetbox { background: var(--a-bg); color: var(--a-ink); width: 100%; border-radius: 22px 22px 0 0; padding: 24px 20px 20px; max-height: 80%; overflow-y: auto; }
.flowlist .sep { font-size: 12px; font-weight: 700; color: var(--muted); padding: 12px 8px 4px; letter-spacing: .02em; }
.phone { position: relative; width: 100%; max-width: 393px; margin-inline: auto; height: 760px; border-radius: 36px; border: 8px solid #10151c; background: var(--a-bg); color: var(--a-ink); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(15, 25, 40, .18); }
@media (max-width: 480px) { .phone { height: 700px; border-width: 6px; border-radius: 28px; } }
.status { display: flex; justify-content: space-between; padding: 10px 22px 4px; font-size: 13px; font-weight: 700; color: var(--a-ink); }
.appbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; min-height: 44px; }
.appbar .back { border: 0; background: none; font-size: 22px; color: var(--a-ink); cursor: pointer; padding: 4px 8px 4px 0; }
.appbar .help { border: 1px solid var(--a-line); background: var(--a-bg); border-radius: 999px; font-size: 12.5px; padding: 5px 10px; color: var(--a-ink); }
.screen { flex: 1; overflow-y: auto; padding: 8px 20px 24px; }
.cta { padding: 12px 20px 18px; background: linear-gradient(to top, var(--a-bg) 80%, rgba(255,255,255,0)); display: grid; gap: 8px; }
.btn { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--a-blue); color: #fff; }
.btn:disabled { background: var(--a-dim); color: #fff; cursor: not-allowed; }
.btn.ghost { background: var(--a-gray); color: var(--a-ink); }
.btn:focus-visible, .opt:focus-visible, .chk:focus-within, .panel button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.h { font-size: 22px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; margin: 12px 0 8px; white-space: pre-line; text-wrap: balance; }
.sub { color: var(--a-sub); font-size: 14.5px; line-height: 1.55; margin: 0 0 20px; }
.eyebrow { color: var(--a-blue, #3182f6); font-size: 13px; font-weight: 600; margin: 4px 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--a-gray); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--a-ink); font-weight: 500; }
.chip b { color: var(--a-blue); }
.small { font-size: 12.5px; color: var(--a-faint); line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }

/* 동의 */
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 12px 2px; border-bottom: 1px solid var(--a-line); cursor: pointer; font-size: 14.5px; line-height: 1.45; }
.chk input { width: 20px; height: 20px; accent-color: var(--a-blue); margin: 1px 0 0; flex: none; }
.chk.all { background: var(--a-gray); border-radius: 12px; padding: 14px 12px; border: 0; font-weight: 700; margin-bottom: 6px; }
.tag { font-size: 12px; font-weight: 700; color: var(--a-blue); margin-right: 4px; }
.tag.opt { color: var(--a-faint); }
.chk small { display: block; color: var(--a-faint); font-size: 12px; margin-top: 2px; }

/* 리스트·카드 */
.rowlist { display: grid; gap: 10px; margin-top: 8px; }
.inst { display: flex; gap: 12px; align-items: center; background: var(--a-gray); border-radius: 14px; padding: 14px; }
.inst .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--a-bg); display: grid; place-items: center; font-weight: 800; color: var(--a-blue); font-size: 13px; flex: none; }
.inst b { display: block; font-size: 15px; }
.inst span { font-size: 12.5px; color: var(--a-sub); }
.illu { height: 180px; border-radius: 20px; background: radial-gradient(circle at 50% 45%, #fee500 0 34px, transparent 35px), var(--a-gray); margin: 28px 0 12px; display: grid; place-items: end center; padding-bottom: 18px; color: var(--a-sub); font-size: 13px; }

.hero { text-align: center; padding: 18px 0 10px; }
.hero .k { color: var(--a-sub); font-size: 15px; }
.hero .v { font-size: 38px; font-weight: 800; color: var(--a-blue); letter-spacing: -0.03em; margin-top: 4px; }
.coin { width: 120px; height: 120px; margin: 14px auto 6px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #9fd0ff, #3182f6 70%); display: grid; place-items: center; color: #fff; font-size: 44px; font-weight: 800; box-shadow: 0 16px 40px rgba(49,130,246,.3); }
.found { display: grid; gap: 14px; padding: 18px 2px 20px; border-bottom: 1px solid var(--a-line); }
.found .it { display: flex; gap: 12px; align-items: flex-start; }
.found .dot { width: 32px; height: 32px; border-radius: 10px; background: var(--a-blue-soft); flex: none; display: grid; place-items: center; color: var(--a-blue); font-weight: 800; font-size: 13px; }
.found .it.off .dot { background: var(--a-gray); color: var(--a-faint); }
.found .k { font-size: 13px; color: var(--a-sub); }
.found .v { font-size: 16px; font-weight: 700; }
.found .it.off .v { color: var(--a-sub); font-weight: 500; font-size: 14.5px; }
.found .ev { font-size: 12.5px; color: var(--a-blue); margin-top: 3px; }
.steps { display: grid; gap: 14px; padding: 20px 2px; }
.steps .st { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.steps .n { width: 22px; height: 22px; border-radius: 50%; background: var(--a-gray); font-size: 12px; display: grid; place-items: center; color: var(--a-sub); }
.steps b { font-size: 14.5px; display: block; }
.steps span { font-size: 13px; color: var(--a-sub); }

.opt { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1.5px solid var(--a-line); background: var(--a-bg); border-radius: 16px; padding: 18px 16px; cursor: pointer; color: var(--a-ink); margin-bottom: 12px; }
.opt b { font-size: 16px; display: block; margin-bottom: 4px; }
.opt span { font-size: 13px; color: var(--a-sub); line-height: 1.5; }
.opt:hover { border-color: var(--a-blue); }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 13px; color: var(--a-sub); }
.field input, .field select { border: 0; border-bottom: 2px solid var(--a-line); padding: 10px 2px; font-size: 18px; font-family: inherit; color: var(--a-ink); background: var(--a-bg); border-radius: 0; }
.field input:focus, .field select:focus { outline: none; border-bottom-color: var(--a-blue); }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fill { border: 0; background: var(--a-blue-soft); color: var(--a-blue); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
.fillall { width: 100%; border: 1.5px dashed #9cc4ff; background: var(--a-bg); color: var(--a-blue); border-radius: 12px; padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; margin-bottom: 18px; }
.field input::placeholder { color: var(--a-dim); }
.field input.bad { border-bottom-color: var(--a-red); }
.ferr { margin: 0; font-size: 12px; color: var(--a-red); }
.gender { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gender button { border: 1.5px solid var(--a-line); background: var(--a-bg); border-radius: 12px; padding: 12px; font-size: 15px; cursor: pointer; color: var(--a-ink); }
.gender button[aria-pressed="true"] { border-color: var(--a-blue); color: var(--a-blue); font-weight: 700; background: var(--a-blue-soft); }
.linkbtn { border: 0; background: none; color: var(--a-blue); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 0; }
.notice { background: var(--a-gray); border-radius: 14px; padding: 14px; font-size: 13px; color: var(--a-sub); line-height: 1.6; }
.notice b { color: var(--a-ink); display: block; margin-bottom: 4px; }
.info { display: grid; gap: 14px; margin-top: 18px; }
.info .i { border-left: 2px solid var(--a-line); padding-left: 12px; }
.info .i b { font-size: 14px; display: block; margin-bottom: 4px; }
.info .i p { margin: 0; font-size: 13px; color: var(--a-sub); line-height: 1.6; }
.info .i.tbd p em { font-style: normal; background: #fff4cf; padding: 0 3px; border-radius: 3px; color: #7a5a00; }
.acct { display: flex; gap: 12px; align-items: center; padding: 14px 0; }
.acct .ic { width: 40px; height: 40px; border-radius: 12px; background: #fff6d6; display: grid; place-items: center; font-weight: 800; color: #8a6d00; font-size: 12px; }
.acct span { font-size: 13px; color: var(--a-sub); display: block; }
.acct b { font-size: 17px; }
.kv { display: grid; gap: 14px; background: var(--a-gray); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.kv h4 { margin: 0; font-size: 14px; }
.kv .r { display: grid; gap: 2px; }
.kv .r span { font-size: 12.5px; color: var(--a-sub); }
.kv .r b { font-size: 15px; }
.warnbox { border: 1px solid #ffd6a8; background: #fff8ef; border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #8a4b00; line-height: 1.55; margin-top: 10px; }
.done { text-align: center; padding-top: 40px; }
.done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--a-blue); color: #fff; font-size: 36px; display: grid; place-items: center; margin: 0 auto 18px; }
.next { text-align: left; margin-top: 32px; }
.load { display: grid; gap: 12px; margin-top: 28px; }
.load .l { display: flex; justify-content: space-between; align-items: center; background: var(--a-gray); border-radius: 12px; padding: 14px; font-size: 14.5px; }
.load .s { font-size: 12.5px; font-weight: 700; color: var(--a-blue); }
.load .s.fail { color: var(--a-red); }
.load .s.skip { color: var(--a-faint); }
@media (prefers-reduced-motion: no-preference) { .spin { display: inline-block; animation: pulse 1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .35; } } }

/* 마이페이지 */
.todo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 10px 0 16px; }
.todo .c { background: var(--a-gray); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.todo .c span { font-size: 12px; color: var(--a-blue); font-weight: 700; }
.todo .c b { font-size: 14px; }
.todo .c button { border: 0; background: var(--a-blue-soft); color: var(--a-blue); border-radius: 10px; padding: 9px; font-weight: 700; font-size: 13px; cursor: pointer; }
.todo .c.only { grid-column: 1 / -1; }
.sum { background: linear-gradient(160deg, #3182f6, #5aa2ff); color: #fff; border-radius: 18px; padding: 18px; }
.sum .t { font-size: 13px; opacity: .9; }
.sum .v { font-size: 26px; font-weight: 800; margin: 2px 0 12px; }
.sum .line { display: flex; justify-content: space-between; font-size: 13.5px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.25); }
.sum .line span:last-child { opacity: .85; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--a-gray); border-radius: 12px; padding: 4px; margin: 22px 0 14px; }
.seg button { border: 0; background: none; padding: 9px; border-radius: 9px; font-size: 14px; color: var(--a-sub); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--a-bg); color: var(--a-ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.track { display: grid; gap: 0; }
.track .p { display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
.track .rail { display: flex; flex-direction: column; align-items: center; }
.track .d { width: 14px; height: 14px; border-radius: 50%; background: var(--a-dim); margin-top: 3px; }
.track .ln { flex: 1; width: 2px; background: var(--a-line); min-height: 26px; }
.track .p.done .d { background: var(--a-blue); }
.track .p.cur .d { background: var(--a-bg); border: 4px solid var(--a-blue); }
.track .p:last-child .ln { display: none; }
.track b { font-size: 14.5px; display: block; }
.track .p.wait b { color: var(--a-faint); font-weight: 500; }
.track .p.cur b { color: var(--a-blue); }
.track span { font-size: 12.5px; color: var(--a-sub); display: block; padding-bottom: 14px; }

/* 검토 패널 */
.panel { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.card h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
.scen { display: flex; flex-wrap: wrap; gap: 8px; }
.scen button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
.scen button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.scen-desc { margin: 12px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.now { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.now h3 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
.src { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 8px; }
.src.fig { background: var(--accent-soft); color: var(--accent); }
.src.prd { background: var(--warn-soft); color: var(--warn); }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; line-height: 1.55; }
.check { margin-top: 14px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; }
.check b { display: block; margin-bottom: 2px; }
.flowlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: s; }
.flowlist li { counter-increment: s; }
.flowlist button { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; border: 0; background: none; color: var(--ink); padding: 7px 8px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
.flowlist button::before { content: counter(s); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.flowlist button:hover { background: var(--bg); }
.flowlist button[aria-current="step"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.flowlist .skip { opacity: .45; }
.flowlist em { font-style: normal; font-size: 11px; color: var(--muted); }
.reset { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--muted); margin-top: 12px; align-items: center; }
.rules .hint { color: var(--accent); list-style: "▸ "; }
.rsnlist { display: grid; gap: 8px; }
.rsn { background: var(--a-gray); border-radius: 14px; padding: 0 14px; }
.rsn summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; cursor: pointer; }
.rsn summary::-webkit-details-marker { display: none; }
.rsn summary b { display: block; font-size: 14.5px; }
.rsn summary small { display: block; font-size: 12px; color: var(--a-sub); margin-top: 2px; }
.rsn summary em { font-style: normal; font-weight: 700; color: var(--a-blue); }
.rsn > div { display: grid; gap: 6px; padding: 0 0 14px; font-size: 13px; color: var(--a-sub); }
.rsn > div .r { display: flex; justify-content: space-between; gap: 8px; }

/* ── 사용감 레이어: 실제 기기 느낌(입체 프레임·전환·알림·서명·진행) ── */
.top .solo-btn { margin-left: auto; }
.stage { perspective: 1600px; }
.device { position: relative; max-width: 393px; margin-inline: auto; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2, .8, .2, 1); }
.device::before { content: ""; position: absolute; right: -4px; top: 190px; width: 5px; height: 84px; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, #39424f, #0b0f14); }
.device::after { content: ""; position: absolute; left: -4px; top: 150px; width: 5px; height: 52px; border-radius: 3px 0 0 3px; background: linear-gradient(270deg, #39424f, #0b0f14); box-shadow: 0 66px 0 #1a2029; }
.phone { max-width: none; border: 10px solid #0d1117; border-radius: 46px; box-shadow: 0 0 0 2px #3a4350, 0 0 0 3.5px #0b0e12, 0 40px 70px -20px rgba(15, 25, 40, .45), 0 18px 30px -16px rgba(15, 25, 40, .35); }
@media (max-width: 480px) { .phone { border-width: 7px; border-radius: 38px; } }
.island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 108px; height: 30px; border-radius: 20px; background: #000; z-index: 30; pointer-events: none; }
.status { align-items: center; padding: 14px 28px 6px; min-height: 46px; }
.sicons { display: inline-flex; gap: 5px; align-items: center; }
.sicons svg { fill: currentColor; display: block; }
.homebar { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 128px; height: 5px; border-radius: 3px; background: #191f28; opacity: .85; z-index: 30; pointer-events: none; }
.cta { padding-bottom: 26px; }
.appbar { transition: box-shadow .2s; position: relative; z-index: 2; }
.appbar.scrolled { box-shadow: 0 1px 0 var(--a-line), 0 6px 12px -10px rgba(0, 0, 0, .25); }

.btn { box-shadow: 0 10px 20px -12px rgba(49, 130, 246, .75), inset 0 -2px 0 rgba(0, 0, 0, .08); transition: transform .12s, box-shadow .12s, background .2s; }
.btn.ghost, .btn:disabled { box-shadow: none; }

  const k = $('ksign'), docs = signDocs(kind);
  k.innerHTML = `<div class="kh"><span class="pi">인증</span><b>카카오톡 인증</b><button class="kx" data-ksign="cancel" aria-label="서명 닫기">✕</button></div>
    <div class="kb"><p class="small" style="margin:0">${kind === 'cmsHosp' ? 'A사 병원비 환급' : 'OO 환급'}에서 인증을 요청했어요</p><h3>${kind === 'cms' ? '세금 환급 결제 계좌 등록' : kind === 'cmsHosp' ? '병원비 환급 결제 계좌 등록' : '본인 확인 전자서명'}</h3>
      <div class="kdoc">${docs.map(d => `<div><span>✓</span>${d}</div>`).join('')}</div>
      <div class="kmeta"><span>요청한 곳</span><b>${kind === 'cmsHosp' ? 'A사 · 병원비 환급' : kind === 'cms' ? 'OO 환급 · B회계법인' : 'OO 환급'}</b><span>서명할 문서</span><b class="num">${docs.length}건${docs.length > 1 ? ' · 한 번에 서명' : ''}</b><span>요청 시각</span><b class="num">${$('clock').textContent}</b></div></div>
    <div class="kf"><button class="kbtn" data-ksign="sign">서명하기</button></div>`;
  k.dataset.kind = kind;
  k.hidden = false; void k.offsetWidth; k.classList.add('show');
}
function closeSign() { const k = $('ksign'); k.classList.remove('show'); setTimeout(() => { if (!k.classList.contains('show')) k.hidden = true; }, 420); }
function doSign() {
  const k = $('ksign'), b = k.querySelector('.kbtn'), scr0 = st.screen;
  b.disabled = true; b.innerHTML = '<span class="spin">서명하는 중…</span>';
  later(() => {
    k.querySelector('.kb').innerHTML = '<div class="kdone"><div class="ok">✓</div><h3 style="margin:6px 0 0">서명이 완료됐어요</h3><p class="small">OO 환급으로 돌아갈게요</p></div>';
    k.querySelector('.kf').innerHTML = ''; buzz(20);
    later(() => {
      closeSign();
      const hiraExpired = scr0 === 'authWait' && S().fail === 'B' && !st.reauthed;
      snack(hiraExpired ? '카카오톡 인증 시간이 만료됐어요' : '카카오톡 인증이 완료됐어요');
      later(() => { if (st.screen === scr0) { const c = $('cta').querySelector('.btn'); if (c && !c.disabled) c.click(); } }, 800);
    }, 900);
  }, 1100);
}

function countdown(el, secs, pad) {
  const tick = () => { if (!el.isConnected) return; const m = Math.floor(secs / 60), s = String(secs % 60).padStart(2, '0'); el.textContent = `${pad ? String(m).padStart(2, '0') : m}:${s}`; if (secs-- > 0) later(tick, 1000); };
  tick();
}
function addTimer(secs) {
  const h = $('screen').querySelector('.h'); if (!h) return;
  const d = document.createElement('div'); d.className = 'timer'; d.innerHTML = '남은 시간 <b></b>';
  h.after(d); countdown(d.querySelector('b'), secs, false);
}
function liveTimer() {
  /* 입력 중 화면이 다시 그려져도 이어서 줄어들도록 매초 요소를 다시 찾음 */
  const find = () => [...$('screen').querySelectorAll('.sub b.num')].find(x => /^\d\d:\d\d$/.test(x.textContent));
  const b0 = find(); if (!b0) return;
  const [m0, s0] = b0.textContent.split(':').map(Number); let secs = m0 * 60 + s0;
  const tick = () => { const b = find(); if (b) b.textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`; if (secs-- > 0) later(tick, 1000); };
  tick();
}
function progress(ms) {
  const scr = $('screen'), chip = scr.querySelector('.chip b'), load = scr.querySelector('.load'); if (!load) return;
  let ss = [...load.querySelectorAll('.s')]; const orig = ss.map(s => s.outerHTML), done = ss.map(() => false);
  ss.forEach(s => { s.className = 's'; s.innerHTML = '<span class="spin">조회 중</span>'; });
  const bar = document.createElement('div'); bar.className = 'pbar'; bar.innerHTML = '<i></i>'; load.before(bar);
  const btn = $('cta').querySelector('.btn'), lbl = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '찾는 중이에요…'; }
  const g = fxGen, t0 = performance.now();
  const step = now => {
    if (g !== fxGen) return;
    const p = RM ? 1 : Math.min(1, (now - t0) / ms), pct = Math.round(p * 100);
    if (chip) chip.textContent = pct + '%';
    bar.firstChild.style.width = pct + '%';
    ss.forEach((s, i) => {
      if (done[i] || p < (i + 1) / ss.length - .001) return;
      done[i] = true;
      const tmp = document.createElement('div'); tmp.innerHTML = orig[i]; const n = tmp.firstElementChild;
      if (n.querySelector('.spin')) n.textContent = '완료';
      n.classList.add('pop'); s.replaceWith(n); ss[i] = n;
    });
    if (p < 1) return later(() => step(performance.now()), 40);
    const b2 = $('cta').querySelector('.btn'); if (b2) { b2.disabled = false; b2.textContent = lbl; }
    buzz(15);
  };
  step(t0);
}
function quiz() {
  const n = [...$('screen').querySelectorAll('.notice')].find(x => x.textContent.includes('퀴즈')); if (!n) return;
  n.insertAdjacentHTML('beforeend', '<div class="ox" role="group" aria-label="퀴즈 답"><button data-ox="O">O</button><button data-ox="X">X</button></div><p class="oxa" hidden>정답은 O예요. 놓친 공제는 경정청구로, 받지 못한 실손보험금은 보험금 청구로 돌려받을 수 있어요.</p>');
}
function countUp(sel) {
  if (RM) return;
  const el = $('screen').querySelector(sel); if (!el) return;
  const txt = el.textContent.trim(), target = /만원$/.test(txt) ? Math.round(parseFloat(txt) * 10000) : +txt.replace(/\D/g, '');
  if (!target) return;
  const g = fxGen, t0 = performance.now(), D = 1000;
  const f = now => { if (g !== fxGen || !el.isConnected) return; const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3); el.textContent = p < 1 ? won(Math.round(target * e / 100) * 100) : txt; if (p < 1) later(() => f(performance.now()), 30); };
  el.textContent = '0원'; f(t0);
}
function burst() {
  if (RM) return;
  const ok = $('screen').querySelector('.done .ok'); if (!ok) return;
  const cols = ['#3182f6', '#fee500', '#5fd39a', '#ff8a65', '#9fd0ff', '#b38cff'];
  const b = document.createElement('div'); b.className = 'burst';
  b.innerHTML = Array.from({ length: 22 }, (_, i) => { const a = (i / 22) * Math.PI * 2 + Math.random() * .3, r = 70 + Math.random() * 70; return `<i style="background:${cols[i % cols.length]};--x:${Math.round(Math.cos(a) * r)}px;--y:${Math.round(Math.sin(a) * r)}px;--r:${Math.round(Math.random() * 540 - 270)}deg;--d:${Math.round(Math.random() * 120)}ms"></i>`; }).join('');
  ok.appendChild(b); buzz([10, 30, 10]);
}
function typeIn(keys) {
  if (RM || !keys.length) return;
  const g = fxGen; let delay = 0;
  keys.forEach(k => {
    const inp = $('f-' + k); if (!inp) return;
    const full = st.f[k]; inp.value = ''; inp.classList.add('typing');
    [...full].forEach((ch, i) => fxT.push(setTimeout(() => { if (g !== fxGen || !inp.isConnected) return; inp.value = full.slice(0, i + 1); if (i === full.length - 1) inp.classList.remove('typing'); }, delay + i * 40)));
    delay += full.length * 40 + 140;
  });
}

const ENTER = {
  authWait() { addTimer(300); later(() => showPush(PUSH.kakao(st.reauthed ? 'OO 환급 · 홈택스 본인 확인 서명을 다시 요청했어요' : 'OO 환급 · 본인 확인 서명이 도착했어요', () => openSign('auth'))), 1700); },
  signWait() { addTimer(300); later(() => showPush(PUSH.kakao('OO 환급 · 세금 환급 결제 계좌 등록 인증이 도착했어요', () => openSign('cms'))), 1500); },
  signWaitHosp() { addTimer(300); later(() => showPush(PUSH.kakao('A사 · 병원비 환급 결제 계좌 등록 인증이 도착했어요', () => openSign('cmsHosp'))), 1500); },
  loading() { quiz(); progress(3800); },
  c4uWait() { progress(3000); },
  c4uDelay() { later(() => showPush({ app: '카카오톡', icon: 'TALK', bg: '#fee500', fg: '#3c1e1e', title: '[OO 환급] 보험 내역 확인 완료', text: '보험 내역 확인이 끝났어요. 병원비 환급액을 확인하고 청구를 진행해 주세요', tap: () => { st.delayDone = true; go('c4uResult'); } }), 3500); },
  result() { countUp('.hero .v'); },
  c4uResult() { countUp('.hero .v'); },
  mypage() { countUp('.sum .v'); },
  done() { burst(); },
  c4uSms() { liveTimer(); pushFill('sms', 'code', `[보험정보 조회사] 인증번호 [${FIELDS.code.sample}]를 입력해 주세요.`, 1800); },
  c4uEmailCode() { liveTimer(); pushFill('mail', 'code', `인증번호 ${FIELDS.code.sample} · 30분 안에 입력해 주세요`, 2000); },
  c4uIdInput() { pushFill('sms', 'idFound', `[보험정보 조회사] 회원님의 아이디는 ${FIELDS.idFound.sample} 입니다.`, 1500); },
  c4uTempPw() { pushFill('sms', 'tempPw', '[보험정보 조회사] 임시 비밀번호가 발급됐어요. 로그인 후 꼭 변경해 주세요.', 1500); },
};

/* 사용감 레이어 입력: 퀴즈, 서명, 진동, 가장자리 스와이프로 뒤로 가기, 앱만 보기 */
document.addEventListener('click', e => {
  const ox = e.target.closest('[data-ox]');
  if (ox) { ox.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === ox)); const a = ox.parentElement.nextElementSibling; a.hidden = false; a.textContent = (ox.dataset.ox === 'O' ? '맞아요! ' : '아쉬워요. ') + '정답은 O예요. 놓친 공제는 경정청구로, 받지 못한 실손보험금은 보험금 청구로 돌려받을 수 있어요.'; return; }
  const ks = e.target.closest('[data-ksign]');
  if (ks) { if (ks.dataset.ksign === 'sign') doSign(); else { closeSign(); snack('서명을 취소했어요'); const lp = lastPush; if (lp) later(() => showPush(lp), 2500); } return; }
  if (e.target.closest('#soloBtn')) { const on = document.body.classList.toggle('solo'); const b = $('soloBtn'); b.setAttribute('aria-pressed', on); b.textContent = on ? '검토 패널 함께 보기' : '앱 화면만 크게 보기'; }
});
document.addEventListener('pointerdown', e => { const b = e.target.closest('#phone button, #phone .chk'); if (b && !b.disabled) buzz(6); });
let swipe = null;
$('phone').addEventListener('pointerdown', e => { const r = $('phone').getBoundingClientRect(); swipe = e.clientX - r.left < 30 && st.hist.length ? { x: e.clientX, y: e.clientY } : null; });
document.addEventListener('pointerup', e => { if (swipe && e.clientX - swipe.x > 70 && Math.abs(e.clientY - swipe.y) < 80) back(); swipe = null; });
$('screen').addEventListener('scroll', () => document.querySelector('.appbar').classList.toggle('scrolled', $('screen').scrollTop > 4), { passive: true });
function tickClock() { const d = new Date(); $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
tickClock(); setInterval(tickClock, 15000);
render();
